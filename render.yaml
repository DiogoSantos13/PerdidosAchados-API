# Configuração para alojar a API gratuitamente no Render (https://render.com)
# No Render: New + → Blueprint → escolher este repositório.
services:
  - type: web
    name: perdidosachados-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: JWT_SEGREDO
        generateValue: true   # o Render gera um segredo aleatório para assinar os tokens
